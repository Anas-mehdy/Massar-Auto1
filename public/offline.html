<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>مسار - وضع عدم الاتصال</title>
  <style>
    :root{font-family:Arial,"Tahoma",sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f0fdfa 0,#f8fafc 35%)}button,input,textarea{font:inherit}.wrap{max-width:820px;margin:auto;padding:20px 14px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:#0f766e;color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:11px;color:#64748b;margin:3px 0 0}.badge{border:1px solid #f59e0b55;background:#fffbeb;color:#92400e;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:16px;box-shadow:0 14px 40px -30px #0f172a;margin-bottom:14px}.muted{color:#64748b;font-size:12px;line-height:1.8}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;font-weight:800;color:#475569}.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#fff;color:#0f172a;outline:none}.field input:focus,.field textarea:focus{border-color:#0f766e}.primary,.ghost,.danger{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#0f766e;color:#fff}.ghost{background:#f1f5f9;color:#334155}.danger{background:#fff1f2;color:#be123c}.customer{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f9}.customer:last-child{border-bottom:0}.customer h3{font-size:14px;margin:0 0 4px}.customer p{font-size:11px;color:#64748b;margin:2px 0;direction:auto}.sync{font-size:10px;color:#b45309;background:#fffbeb;border-radius:999px;padding:4px 7px;white-space:nowrap}.empty{text-align:center;padding:28px 10px;color:#94a3b8;font-size:12px}.notice{padding:10px 12px;border-radius:12px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:700;margin-bottom:12px}.error{background:#fff1f2;color:#be123c}.signedout{text-align:center;padding:36px 18px}.signedout h2{font-size:18px;margin:0 0 8px}@media(max-width:560px){.top{align-items:flex-start}.customer{flex-direction:column}.customer .row{justify-content:flex-start}.wrap{padding-top:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="brand"><div class="logo">م</div><div><h1>مسار</h1><p>العمل المحلي الآمن</p></div></div>
      <div class="badge">أنت بدون إنترنت</div>
    </div>

    <section id="signedOut" class="card signedout hidden">
      <h2>لا توجد جلسة أوفلاين صالحة</h2>
      <p class="muted">لا يمكن عرض بيانات أي متجر بدون جلسة موثوقة محفوظة مسبقاً. اتصل بالإنترنت وسجّل الدخول مرة واحدة لإعادة تفعيل العمل المحلي.</p>
      <button class="primary" type="button" onclick="location.href='/login'">الذهاب لتسجيل الدخول</button>
    </section>

    <div id="workspace" class="hidden">
      <section class="card">
        <div class="row">
          <div class="grow"><strong id="shopName">المتجر</strong><div id="userName" class="muted"></div></div>
          <button id="retryOnline" class="ghost" type="button">محاولة الرجوع أونلاين</button>
          <button id="localLogout" class="danger" type="button">تسجيل خروج محلي</button>
        </div>
      </section>

      <section class="card">
        <div class="row"><div class="grow"><strong id="formTitle">إضافة عميل</strong><div class="muted">سيتم حفظ العملية على هذا الجهاز وإرسالها عند عودة الاتصال.</div></div></div>
        <div id="message" class="notice hidden"></div>
        <form id="customerForm">
          <input id="customerId" type="hidden" />
          <div class="field"><label for="name">اسم العميل *</label><input id="name" required autocomplete="name" /></div>
          <div class="field"><label for="phone">الهاتف</label><input id="phone" inputmode="tel" autocomplete="tel" /></div>
          <div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" /></div>
          <div class="field"><label for="notes">ملاحظات</label><textarea id="notes" rows="2"></textarea></div>
          <div class="row"><button class="primary" type="submit">حفظ محلياً</button><button id="cancelEdit" class="ghost hidden" type="button">إلغاء التعديل</button></div>
        </form>
      </section>

      <section class="card">
        <div class="row"><div class="grow"><strong>العملاء على هذا الجهاز</strong><div id="count" class="muted"></div></div></div>
        <div id="customers"></div>
      </section>
    </div>
  </main>
  <script src="/offline.js" defer></script>
</body>
</html>
