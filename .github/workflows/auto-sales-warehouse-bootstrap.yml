name: Auto sales warehouse bootstrap

on:
  push:
    branches:
      - feature/auto-core-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/massar_auto_ci?schema=public
      OPENAI_API_KEY: ""
      PURCHASE_AI_MODEL: gpt-4.1-mini
      PURCHASE_AI_SHOP_DAILY_LIMIT: "6"
      PURCHASE_AI_FEATURE_BUDGET_USD: "5"
      PURCHASE_AI_MAX_OUTPUT_TOKENS: "8000"
      PURCHASE_AI_PDF_DETAIL: high
      PURCHASE_IMPORT_MAX_FILE_MB: "4"
      PURCHASE_IMPORT_MAX_PDF_PAGES: "3"
      PURCHASE_IMPORT_EXTRACTING_STALE_MINUTES: "5"
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      GROWTH_LIFECYCLE_EMAILS_ENABLED: "false"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: massar_auto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d massar_auto_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch inventory sales through default warehouse
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/services/salesService.ts')
          text = path.read_text()
          if 'async function ensureSaleDefaultWarehouseTx(' in text:
              raise SystemExit('sales warehouse patch already present')

          marker = 'export async function createSale(shopId: string, createdByUserId: string | null, input: CreateSaleInput) {'
          helper = '''async function ensureSaleDefaultWarehouseTx(tx: Prisma.TransactionClient, shopId: string) {\n  const rows = await tx.$queryRaw<Array<{ id: string; name: string }>>`\n    SELECT "id", "name" FROM "Warehouse"\n    WHERE "shopId"=${shopId}::uuid AND "isDefault"=TRUE AND "isActive"=TRUE AND "deletedAt" IS NULL\n    LIMIT 1\n    FOR UPDATE\n  `;\n  if (rows[0]) return rows[0];\n  await tx.$queryRaw<Array<{ id: string }>>`SELECT "id" FROM "Shop" WHERE "id"=${shopId}::uuid FOR UPDATE`;\n  const second = await tx.$queryRaw<Array<{ id: string; name: string }>>`\n    SELECT "id", "name" FROM "Warehouse"\n    WHERE "shopId"=${shopId}::uuid AND "isDefault"=TRUE AND "isActive"=TRUE AND "deletedAt" IS NULL\n    LIMIT 1\n  `;\n  if (second[0]) return second[0];\n  const created = await tx.$queryRaw<Array<{ id: string; name: string }>>`\n    INSERT INTO "Warehouse" ("shopId", "code", "name", "isDefault", "isActive")\n    VALUES (${shopId}::uuid, 'MAIN', 'المستودع الرئيسي', TRUE, TRUE)\n    RETURNING "id", "name"\n  `;\n  return created[0];\n}\n\n'''
          if marker not in text:
              raise SystemExit('createSale marker not found')
          text = text.replace(marker, helper + marker, 1)

          old = '''      if (inventoryItem) { const quantityAfter = inventoryItem.quantity - itemInput.quantity; await tx.inventoryItem.update({ where: { id: inventoryItem.id }, data: { quantity: quantityAfter, version: { increment: 1 } } }); await tx.inventoryMovement.create({ data: { shopId, inventoryItemId: inventoryItem.id, saleId: sale.id, saleItemId: saleItem.id, createdByUserId, type: InventoryMovementType.SALE, quantityChange: -itemInput.quantity, quantityAfter, unitCostSnapshot: inventoryItem.unitCost, note: "بيع" } }); }'''
          new = '''      if (inventoryItem) {\n        const warehouse = await ensureSaleDefaultWarehouseTx(tx, shopId);\n        const stocks = await tx.$queryRaw<Array<{ quantity: number; averageCost: Prisma.Decimal | null }>>`\n          SELECT "quantity", "averageCost" FROM "WarehouseStock"\n          WHERE "shopId"=${shopId}::uuid AND "warehouseId"=${warehouse.id}::uuid AND "inventoryItemId"=${inventoryItem.id}::uuid\n          FOR UPDATE\n        `;\n        const stock = stocks[0];\n        if (!stock || stock.quantity < itemInput.quantity) throw new Error(`الرصيد المتاح في المستودع الرئيسي غير كافٍ للقطعة: ${inventoryItem.name}. المتاح: ${stock?.quantity ?? 0}`);\n        const warehouseAfter = stock.quantity - itemInput.quantity;\n        await tx.$executeRaw`\n          UPDATE "WarehouseStock" SET "quantity"=${warehouseAfter}, "updatedAt"=NOW()\n          WHERE "shopId"=${shopId}::uuid AND "warehouseId"=${warehouse.id}::uuid AND "inventoryItemId"=${inventoryItem.id}::uuid\n        `;\n        const quantityAfter = inventoryItem.quantity - itemInput.quantity;\n        await tx.inventoryItem.update({ where: { id: inventoryItem.id }, data: { quantity: quantityAfter, version: { increment: 1 } } });\n        await tx.inventoryMovement.create({ data: { shopId, inventoryItemId: inventoryItem.id, saleId: sale.id, saleItemId: saleItem.id, createdByUserId, type: InventoryMovementType.SALE, quantityChange: -itemInput.quantity, quantityAfter, unitCostSnapshot: inventoryItem.unitCost, note: "بيع" } });\n        await tx.$executeRaw`\n          INSERT INTO "WarehouseMovement" (\n            "shopId", "warehouseId", "inventoryItemId", "type", "quantityChange", "quantityBefore", "quantityAfter",\n            "unitCostSnapshot", "saleId", "createdByUserId", "reference", "note"\n          ) VALUES (\n            ${shopId}::uuid, ${warehouse.id}::uuid, ${inventoryItem.id}::uuid, 'SALE_OUT', ${-itemInput.quantity},\n            ${stock.quantity}, ${warehouseAfter}, ${inventoryItem.unitCost}, ${sale.id}::uuid, ${createdByUserId}::uuid,\n            ${sale.receiptNumber}, ${`بيع من ${warehouse.name}`}\n          )\n        `;\n      }'''
          if old not in text:
              raise SystemExit('create sale inventory marker not found')
          text = text.replace(old, new, 1)

          old_cancel = '''    for (const saleItem of sale.items) { if (!saleItem.inventoryItemId) continue; const inventoryItem = await tx.inventoryItem.findFirst({ where: { id: saleItem.inventoryItemId, shopId, deletedAt: null } }); if (!inventoryItem) throw new Error("لا يمكن إلغاء البيع لأن قطعة مخزون مرتبطة غير موجودة."); const quantityAfter = inventoryItem.quantity + saleItem.quantity; await tx.inventoryItem.update({ where: { id: inventoryItem.id }, data: { quantity: quantityAfter, version: { increment: 1 } } }); await tx.inventoryMovement.create({ data: { shopId, inventoryItemId: inventoryItem.id, saleId: sale.id, saleItemId: saleItem.id, createdByUserId, type: InventoryMovementType.RETURN, quantityChange: saleItem.quantity, quantityAfter, unitCostSnapshot: inventoryItem.unitCost, note: "إلغاء عملية بيع" } }); }'''
          new_cancel = '''    for (const saleItem of sale.items) {\n      if (!saleItem.inventoryItemId) continue;\n      const inventoryItem = await tx.inventoryItem.findFirst({ where: { id: saleItem.inventoryItemId, shopId, deletedAt: null } });\n      if (!inventoryItem) throw new Error("لا يمكن إلغاء البيع لأن قطعة مخزون مرتبطة غير موجودة.");\n      const warehouse = await ensureSaleDefaultWarehouseTx(tx, shopId);\n      await tx.$executeRaw`\n        INSERT INTO "WarehouseStock" ("shopId", "warehouseId", "inventoryItemId", "quantity", "reservedQuantity", "reorderLevel", "averageCost")\n        VALUES (${shopId}::uuid, ${warehouse.id}::uuid, ${inventoryItem.id}::uuid, 0, 0, 0, ${inventoryItem.unitCost})\n        ON CONFLICT ("warehouseId", "inventoryItemId") DO NOTHING\n      `;\n      const stocks = await tx.$queryRaw<Array<{ quantity: number }>>`\n        SELECT "quantity" FROM "WarehouseStock"\n        WHERE "shopId"=${shopId}::uuid AND "warehouseId"=${warehouse.id}::uuid AND "inventoryItemId"=${inventoryItem.id}::uuid\n        FOR UPDATE\n      `;\n      const stock = stocks[0];\n      if (!stock) throw new Error("تعذر تجهيز رصيد المستودع عند إلغاء البيع.");\n      const warehouseAfter = stock.quantity + saleItem.quantity;\n      await tx.$executeRaw`\n        UPDATE "WarehouseStock" SET "quantity"=${warehouseAfter}, "averageCost"=COALESCE("averageCost", ${inventoryItem.unitCost}), "updatedAt"=NOW()\n        WHERE "shopId"=${shopId}::uuid AND "warehouseId"=${warehouse.id}::uuid AND "inventoryItemId"=${inventoryItem.id}::uuid\n      `;\n      const quantityAfter = inventoryItem.quantity + saleItem.quantity;\n      await tx.inventoryItem.update({ where: { id: inventoryItem.id }, data: { quantity: quantityAfter, version: { increment: 1 } } });\n      await tx.inventoryMovement.create({ data: { shopId, inventoryItemId: inventoryItem.id, saleId: sale.id, saleItemId: saleItem.id, createdByUserId, type: InventoryMovementType.RETURN, quantityChange: saleItem.quantity, quantityAfter, unitCostSnapshot: inventoryItem.unitCost, note: "إلغاء عملية بيع" } });\n      await tx.$executeRaw`\n        INSERT INTO "WarehouseMovement" (\n          "shopId", "warehouseId", "inventoryItemId", "type", "quantityChange", "quantityBefore", "quantityAfter",\n          "unitCostSnapshot", "saleId", "createdByUserId", "reference", "note"\n        ) VALUES (\n          ${shopId}::uuid, ${warehouse.id}::uuid, ${inventoryItem.id}::uuid, 'SALES_RETURN', ${saleItem.quantity},\n          ${stock.quantity}, ${warehouseAfter}, ${inventoryItem.unitCost}, ${sale.id}::uuid, ${createdByUserId}::uuid,\n          ${sale.receiptNumber}, 'إلغاء عملية بيع وإعادة القطعة للمستودع'\n        )\n      `;\n    }'''
          if old_cancel not in text:
              raise SystemExit('cancel sale inventory marker not found')
          text = text.replace(old_cancel, new_cancel, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Full application build
        run: npm run build
      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/salesService.ts
          git commit -m "feat(auto): route sales stock through default warehouse"
          git push origin HEAD:feature/auto-core-v1
