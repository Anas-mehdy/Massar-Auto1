name: Offline V1 verification (no deploy)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/offline-core-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: massar_offline_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d massar_offline_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/massar_offline_verify?schema=public
      OPENAI_API_KEY: ""
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      GROWTH_LIFECYCLE_EMAILS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci --ignore-scripts

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Build disposable database from current Prisma schema
        run: npx prisma db push --skip-generate

      - name: Seed pre-offline customer for backfill verification
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d massar_offline_verify -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Shop" ("id", "name", "createdAt", "updatedAt", "version")
          VALUES ('11111111-1111-4111-8111-111111111111', 'Offline CI Shop', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 1);

          INSERT INTO "Customer" (
            "id", "shopId", "name", "createdAt", "updatedAt", "version"
          ) VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'Existing Offline Customer',
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP,
            1
          );
          SQL

      - name: Apply Offline V1 sync migration to disposable database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d massar_offline_verify -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20260909121500_add_offline_sync_foundation/migration.sql

      - name: Verify Offline V1 sync schema, backfill and trigger
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d massar_offline_verify -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            backfill_count integer;
            trigger_count integer;
          BEGIN
            IF to_regclass('public."SyncDevice"') IS NULL THEN RAISE EXCEPTION 'SyncDevice missing'; END IF;
            IF to_regclass('public."SyncMutation"') IS NULL THEN RAISE EXCEPTION 'SyncMutation missing'; END IF;
            IF to_regclass('public."SyncChange"') IS NULL THEN RAISE EXCEPTION 'SyncChange missing'; END IF;

            SELECT COUNT(*) INTO backfill_count
            FROM "SyncChange"
            WHERE "shopId" = '11111111-1111-4111-8111-111111111111'::uuid
              AND "entityId" = '22222222-2222-4222-8222-222222222222'::uuid
              AND "entityType" = 'customer';
            IF backfill_count <> 1 THEN
              RAISE EXCEPTION 'Expected exactly one customer backfill row, got %', backfill_count;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'Customer_sync_change_trigger' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'Customer sync trigger missing';
            END IF;

            UPDATE "Customer"
            SET "name" = 'Existing Offline Customer Updated',
                "version" = "version" + 1,
                "updatedAt" = CURRENT_TIMESTAMP
            WHERE "id" = '22222222-2222-4222-8222-222222222222'::uuid;

            SELECT COUNT(*) INTO trigger_count
            FROM "SyncChange"
            WHERE "shopId" = '11111111-1111-4111-8111-111111111111'::uuid
              AND "entityId" = '22222222-2222-4222-8222-222222222222'::uuid
              AND "entityType" = 'customer';
            IF trigger_count <> 2 THEN
              RAISE EXCEPTION 'Expected trigger to append a second change row, got %', trigger_count;
            END IF;
          END $$;
          SQL

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Full application build
        run: npm run build
