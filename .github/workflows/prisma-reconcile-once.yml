name: Prisma Reconcile Once

on:
  push:
    branches:
      - feature/auto-core-v1
    paths:
      - .github/workflows/prisma-reconcile-once.yml

permissions:
  contents: write

jobs:
  patch-schema:
    if: github.event.head_commit.message == 'chore(auto): add one-time prisma reconciliation runner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/auto-core-v1
          fetch-depth: 0

      - name: Reconcile Invoice serviceOrderId
        shell: python
        run: |
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          text = path.read_text()

          field_anchor = '  repairOrderId     String?       @db.Uuid\n  saleId            String?       @db.Uuid\n'
          field_replacement = '  repairOrderId     String?       @db.Uuid\n  serviceOrderId    String?       @db.Uuid\n  saleId            String?       @db.Uuid\n'
          index_anchor = '  @@index([shopId, repairOrderId])\n  @@index([shopId, saleId])\n'
          index_replacement = '  @@index([shopId, repairOrderId])\n  @@index([shopId, serviceOrderId])\n  @@index([shopId, saleId])\n'

          if text.count(field_anchor) != 1:
              raise SystemExit(f'Expected exactly one Invoice field anchor, found {text.count(field_anchor)}')
          if text.count(index_anchor) != 1:
              raise SystemExit(f'Expected exactly one Invoice index anchor, found {text.count(index_anchor)}')

          text = text.replace(field_anchor, field_replacement, 1)
          text = text.replace(index_anchor, index_replacement, 1)
          path.write_text(text)

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "chore(auto): reconcile invoice service order field"
          git push origin HEAD:feature/auto-core-v1
