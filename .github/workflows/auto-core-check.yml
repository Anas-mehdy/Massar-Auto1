name: Massar Auto Core Check

on:
  push:
    branches:
      - feature/auto-core-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: massar-auto-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/auto-core-v1
          fetch-depth: 0

      - name: Reconcile Vehicle and ServiceOrder models
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path('prisma/schema.prisma')
          text = path.read_text()

          if 'model Vehicle {' in text and 'model ServiceOrder {' in text:
              print('Vehicle and ServiceOrder already reconciled')
              raise SystemExit(0)
          if 'model Vehicle {' in text or 'model ServiceOrder {' in text:
              raise SystemExit('Partial Vehicle/ServiceOrder reconciliation detected')

          def replace_once(anchor: str, replacement: str, label: str):
              global text
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(anchor, replacement, 1)

          replace_once(
              '  repairOrders              RepairOrder[]\n',
              '  repairOrders              RepairOrder[]\n  vehicles                  Vehicle[]      @relation("AutoVehicleShop")\n  autoServiceOrders         ServiceOrder[] @relation("AutoServiceOrderShop")\n',
              'Shop relations',
          )

          replace_once(
              '  createdExpenses            Expense[]            @relation("ExpenseCreator")\n  passwordResetTokens        PasswordResetToken[]\n',
              '  createdExpenses            Expense[]            @relation("ExpenseCreator")\n  receivedAutoServiceOrders  ServiceOrder[]       @relation("AutoServiceOrderReceptionist")\n  assignedAutoServiceOrders  ServiceOrder[]       @relation("AutoServiceOrderAssignee")\n  createdAutoServiceOrders   ServiceOrder[]       @relation("AutoServiceOrderCreator")\n  updatedAutoServiceOrders   ServiceOrder[]       @relation("AutoServiceOrderUpdater")\n  deliveredAutoServiceOrders ServiceOrder[]       @relation("AutoServiceOrderDeliveredBy")\n  closedAutoServiceOrders    ServiceOrder[]       @relation("AutoServiceOrderClosedBy")\n  passwordResetTokens        PasswordResetToken[]\n',
              'User relations',
          )

          replace_once(
              '  repairOrders     RepairOrder[]\n  sales            Sale[]\n',
              '  repairOrders      RepairOrder[]\n  vehicles          Vehicle[]      @relation("AutoVehicleCustomer")\n  autoServiceOrders ServiceOrder[] @relation("AutoServiceOrderCustomer")\n  sales             Sale[]\n',
              'Customer relations',
          )

          replace_once(
              '  repairOrder     RepairOrder?     @relation(fields: [repairOrderId], references: [id], onDelete: SetNull)\n  sale            Sale?            @relation(fields: [saleId], references: [id], onDelete: SetNull)\n',
              '  repairOrder     RepairOrder?     @relation(fields: [repairOrderId], references: [id], onDelete: SetNull)\n  serviceOrder    ServiceOrder?    @relation("AutoServiceOrderInvoices", fields: [shopId, serviceOrderId], references: [shopId, id], onDelete: Restrict, map: "Invoice_service_order_shop_fkey")\n  sale            Sale?            @relation(fields: [saleId], references: [id], onDelete: SetNull)\n',
              'Invoice service relation',
          )

          models = dedent('''
          model Vehicle {
            id              String    @id @default(uuid()) @db.Uuid
            shopId          String    @db.Uuid
            customerId      String    @db.Uuid
            plateNumber     String?
            vin             String?
            make            String
            model           String
            year            Int?
            color           String?
            engineNumber    String?
            fuelType        String?   @db.VarChar(24)
            transmission    String?   @db.VarChar(24)
            engineDetails   String?
            currentOdometer Int?
            notes           String?
            createdAt       DateTime  @default(now()) @db.Timestamptz(6)
            updatedAt       DateTime  @default(now()) @db.Timestamptz(6)
            deletedAt       DateTime? @db.Timestamptz(6)
            version         Int       @default(1)

            shop          Shop           @relation("AutoVehicleShop", fields: [shopId], references: [id], onDelete: Cascade, map: "Vehicle_shopId_fkey")
            customer      Customer       @relation("AutoVehicleCustomer", fields: [customerId], references: [id], onDelete: Restrict, map: "Vehicle_customerId_fkey")
            serviceOrders ServiceOrder[] @relation("AutoVehicleServiceOrders")

            @@unique([shopId, id], map: "Vehicle_shop_id_key")
            @@index([shopId, customerId, createdAt(sort: Desc)], map: "Vehicle_shop_customer_idx")
            @@index([shopId, make, model], map: "Vehicle_shop_make_model_idx")
            @@index([shopId, deletedAt], map: "Vehicle_shop_deleted_idx")
          }

          model ServiceOrder {
            id                 String    @id @default(uuid()) @db.Uuid
            shopId             String    @db.Uuid
            vehicleId          String    @db.Uuid
            customerId         String    @db.Uuid
            orderNumber        String
            status             String    @default("RECEIVED") @db.VarChar(40)
            reportedIssue      String
            receptionNotes     String?
            exteriorCondition  String?
            keysAndItems       String?
            diagnosis          String?
            resolutionNotes    String?
            odometerAtIntake   Int?
            fuelLevelPercent   Decimal?  @db.Decimal(5, 2)
            estimatedTotal     Decimal?  @db.Decimal(14, 2)
            finalTotal         Decimal?  @db.Decimal(14, 2)
            receivedAt         DateTime  @default(now()) @db.Timestamptz(6)
            promisedAt         DateTime? @db.Timestamptz(6)
            approvedAt         DateTime? @db.Timestamptz(6)
            startedAt          DateTime? @db.Timestamptz(6)
            readyAt            DateTime? @db.Timestamptz(6)
            deliveredAt        DateTime? @db.Timestamptz(6)
            closedAt           DateTime? @db.Timestamptz(6)
            receptionistUserId String?   @db.Uuid
            assignedToUserId   String?   @db.Uuid
            createdByUserId    String?   @db.Uuid
            updatedByUserId    String?   @db.Uuid
            clientGeneratedId  String?
            createdAt          DateTime  @default(now()) @db.Timestamptz(6)
            updatedAt          DateTime  @default(now()) @db.Timestamptz(6)
            deletedAt          DateTime? @db.Timestamptz(6)
            version            Int       @default(1)
            odometerAtDelivery Int?
            deliveryNotes      String?
            deliveredByUserId  String?   @db.Uuid
            closedByUserId     String?   @db.Uuid

            shop         Shop      @relation("AutoServiceOrderShop", fields: [shopId], references: [id], onDelete: Cascade, map: "ServiceOrder_shopId_fkey")
            vehicle      Vehicle   @relation("AutoVehicleServiceOrders", fields: [shopId, vehicleId], references: [shopId, id], onDelete: Restrict, map: "ServiceOrder_vehicle_shop_fkey")
            customer     Customer  @relation("AutoServiceOrderCustomer", fields: [customerId], references: [id], onDelete: Restrict, map: "ServiceOrder_customerId_fkey")
            receptionist User?     @relation("AutoServiceOrderReceptionist", fields: [receptionistUserId], references: [id], onDelete: SetNull, map: "ServiceOrder_receptionistUserId_fkey")
            assignedTo   User?     @relation("AutoServiceOrderAssignee", fields: [assignedToUserId], references: [id], onDelete: SetNull, map: "ServiceOrder_assignedToUserId_fkey")
            createdBy    User?     @relation("AutoServiceOrderCreator", fields: [createdByUserId], references: [id], onDelete: SetNull, map: "ServiceOrder_createdByUserId_fkey")
            updatedBy    User?     @relation("AutoServiceOrderUpdater", fields: [updatedByUserId], references: [id], onDelete: SetNull, map: "ServiceOrder_updatedByUserId_fkey")
            deliveredBy  User?     @relation("AutoServiceOrderDeliveredBy", fields: [deliveredByUserId], references: [id], onDelete: SetNull, map: "ServiceOrder_deliveredByUserId_fkey")
            closedBy     User?     @relation("AutoServiceOrderClosedBy", fields: [closedByUserId], references: [id], onDelete: SetNull, map: "ServiceOrder_closedByUserId_fkey")
            invoices     Invoice[] @relation("AutoServiceOrderInvoices")

            @@unique([shopId, orderNumber], map: "ServiceOrder_shop_order_number_key")
            @@unique([shopId, id], map: "ServiceOrder_shop_id_key")
            @@index([shopId, status, receivedAt(sort: Desc)], map: "ServiceOrder_shop_status_idx")
            @@index([shopId, vehicleId, receivedAt(sort: Desc)], map: "ServiceOrder_shop_vehicle_idx")
            @@index([shopId, customerId, receivedAt(sort: Desc)], map: "ServiceOrder_shop_customer_idx")
            @@index([shopId, assignedToUserId, status], map: "ServiceOrder_shop_assignee_idx")
            @@index([shopId, deletedAt], map: "ServiceOrder_shop_deleted_idx")
          }

          ''')

          replace_once('model RepairOrder {', models + 'model RepairOrder {', 'Auto model insertion')
          path.write_text(text)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit reconciled Prisma schema
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No Prisma schema changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "chore(auto): reconcile vehicle service order models"
          git push origin HEAD:feature/auto-core-v1
