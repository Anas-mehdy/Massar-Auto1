name: Massar Auto Core Check

on:
  push:
    branches:
      - feature/auto-core-v1
  workflow_dispatch:

concurrency:
  group: massar-auto-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/auto-core-v1
          fetch-depth: 0

      - name: Apply reconciliation
        run: python scripts/reconcile-labor-prisma.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- prisma/schema.prisma lib/services/autoServiceOrderService.ts; then exit 0; fi
          git add prisma/schema.prisma lib/services/autoServiceOrderService.ts
          git commit -m "chore(auto): reconcile service labor model"
          git push origin HEAD:feature/auto-core-v1
