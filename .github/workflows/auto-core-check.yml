name: Massar Auto Core Check

on:
  push:
    branches:
      - feature/auto-core-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: massar-auto-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link correction history
        run: python scripts/link-part-corrections-vehicle-history.py

      - name: Verify correction history
        run: |
          grep -F 'تصحيحات ما بعد التسليم' 'app/vehicles/[id]/_vehicle-history.tsx'
          grep -F 'vehiclePartCorrectionHistoryService.getVehiclePartCorrectionHistory' 'app/vehicles/[id]/_vehicle-history.tsx'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit correction history link
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- 'app/vehicles/[id]/_vehicle-history.tsx'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/vehicles/[id]/_vehicle-history.tsx'
          git commit -m 'feat(auto): show post-delivery corrections in vehicle history'
          git push origin HEAD:feature/auto-core-v1
