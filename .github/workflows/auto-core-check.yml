name: Massar Auto Core Check

on:
  push:
    branches:
      - feature/auto-core-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: massar-auto-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit details
        run: |
          echo "=== PRODUCTION AUDIT ==="
          npm audit --omit=dev --json || true
          echo "=== FULL AUDIT ==="
          npm audit --json || true

      - name: Dependency fix preview
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          cp package.json /tmp/package.before.json
          npm audit fix --package-lock-only --ignore-scripts || true
          echo "=== PROPOSED PACKAGE VERSIONS ==="
          npm ls next prisma @prisma/client postcss nanoid sharp deepmerge-ts browserslist brace-expansion js-yaml baseline-browser-mapping --all || true
          echo "=== PROPOSED PRODUCTION AUDIT ==="
          npm audit --omit=dev --json || true
          echo "=== PROPOSED FULL AUDIT ==="
          npm audit --json || true
          echo "=== LOCKFILE DIFF STAT ==="
          git diff --stat -- package.json package-lock.json || true
          cp /tmp/package-lock.before.json package-lock.json
          cp /tmp/package.before.json package.json

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Auto route retirement checks
        run: node scripts/test-auto-core-static.cjs routes

      - name: Auto inventory boundary checks
        run: node scripts/test-auto-core-static.cjs inventory

      - name: Auto user-facing content checks
        run: node scripts/test-auto-core-static.cjs content

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
