name: Massar Auto Core Check

on:
  push:
    branches:
      - feature/auto-core-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: massar-auto-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile Invoice serviceOrderId
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore(auto): stage prisma invoice reconciliation retry' }}"
        shell: python
        run: |
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          text = path.read_text()

          field_anchor = '  repairOrderId     String?       @db.Uuid\n  saleId            String?       @db.Uuid\n'
          field_replacement = '  repairOrderId     String?       @db.Uuid\n  serviceOrderId    String?       @db.Uuid\n  saleId            String?       @db.Uuid\n'
          index_anchor = '  @@index([shopId, repairOrderId])\n  @@index([shopId, saleId])\n'
          index_replacement = '  @@index([shopId, repairOrderId])\n  @@index([shopId, serviceOrderId])\n  @@index([shopId, saleId])\n'

          if text.count(field_anchor) != 1:
              raise SystemExit(f'Expected exactly one Invoice field anchor, found {text.count(field_anchor)}')
          if text.count(index_anchor) != 1:
              raise SystemExit(f'Expected exactly one Invoice index anchor, found {text.count(index_anchor)}')

          text = text.replace(field_anchor, field_replacement, 1)
          text = text.replace(index_anchor, index_replacement, 1)
          path.write_text(text)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit reconciled Prisma schema
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore(auto): stage prisma invoice reconciliation retry' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "chore(auto): reconcile invoice service order field"
          git push origin HEAD:feature/auto-core-v1
