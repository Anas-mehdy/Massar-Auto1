name: Massar Auto Core Check

on:
  push:
    branches:
      - feature/auto-core-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: massar-auto-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build secure dependency candidate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.next = '15.5.25';
          pkg.devDependencies['eslint-config-next'] = '15.5.25';
          pkg.devDependencies.postcss = '8.5.28';
          pkg.overrides = {
            ...(pkg.overrides || {}),
            postcss: '$postcss',
            'deepmerge-ts': '8.0.0'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
          echo "=== CANDIDATE PRODUCTION AUDIT ==="
          npm audit --omit=dev --json
          echo "=== CANDIDATE FULL AUDIT ==="
          npm audit --json || true
          echo "=== CANDIDATE KEY VERSIONS ==="
          npm ls next eslint-config-next prisma @prisma/client @prisma/config deepmerge-ts postcss sharp nanoid --all

      - name: Upload secure dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: secure-dependency-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Auto route retirement checks
        run: node scripts/test-auto-core-static.cjs routes

      - name: Auto inventory boundary checks
        run: node scripts/test-auto-core-static.cjs inventory

      - name: Auto user-facing content checks
        run: node scripts/test-auto-core-static.cjs content

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
