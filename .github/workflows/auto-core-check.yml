name: Massar Auto Core Check

on:
  push:
    branches:
      - feature/auto-core-v1
  workflow_dispatch:

concurrency:
  group: massar-auto-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/auto-core-v1
          fetch-depth: 0

      - name: Reconcile ServiceOrder reads
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/services/autoServiceOrderService.ts')
          text = path.read_text()

          technician_re = re.compile(
              r'async function assertActiveTechnician\(shopId: string, userId\?: string \| null\) \{.*?\n\}\n\nexport async function createServiceOrder',
              re.S,
          )
          technician_replacement = '''async function assertActiveTechnician(shopId: string, userId?: string | null) {
            if (!userId) return;
            const member = await prisma.membership.findFirst({
              where: {
                shopId,
                userId,
                status: "ACTIVE",
                role: "TECHNICIAN",
                deletedAt: null,
                user: { is: { deletedAt: null } },
              },
              select: { id: true },
            });
            if (!member) throw new Error("الموظف المحدد ليس فني صيانة نشطاً في هذا المركز.");
          }

          export async function createServiceOrder'''

          if 'const rows = await prisma.$queryRaw<Array<{ userId: string }>>`' in text:
              text, count = technician_re.subn(technician_replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'assertActiveTechnician replacement count={count}')

          read_re = re.compile(
              r'export async function listServiceOrders\(.*?\n\}\n\nexport async function updateServiceOrderStatus\(',
              re.S,
          )
          read_replacement = '''function mapServiceOrderSummary(row: {
            id: string;
            shopId: string;
            vehicleId: string;
            customerId: string;
            orderNumber: string;
            status: string;
            reportedIssue: string;
            receptionNotes: string | null;
            diagnosis: string | null;
            odometerAtIntake: number | null;
            fuelLevelPercent: unknown;
            estimatedTotal: unknown;
            finalTotal: unknown;
            receivedAt: Date;
            promisedAt: Date | null;
            deliveredAt: Date | null;
            closedAt: Date | null;
            assignedToUserId: string | null;
            customer: { name: string; phone: string | null };
            vehicle: { make: string; model: string; year: number | null; plateNumber: string | null; vin: string | null };
          }): ServiceOrderSummary {
            return {
              id: row.id,
              shopId: row.shopId,
              vehicleId: row.vehicleId,
              customerId: row.customerId,
              orderNumber: row.orderNumber,
              status: row.status as ServiceOrderStatus,
              reportedIssue: row.reportedIssue,
              receptionNotes: row.receptionNotes,
              diagnosis: row.diagnosis,
              odometerAtIntake: row.odometerAtIntake,
              fuelLevelPercent: row.fuelLevelPercent == null ? null : Number(row.fuelLevelPercent),
              estimatedTotal: row.estimatedTotal == null ? null : Number(row.estimatedTotal),
              finalTotal: row.finalTotal == null ? null : Number(row.finalTotal),
              receivedAt: row.receivedAt,
              promisedAt: row.promisedAt,
              deliveredAt: row.deliveredAt,
              closedAt: row.closedAt,
              assignedToUserId: row.assignedToUserId,
              customerName: row.customer.name,
              customerPhone: row.customer.phone,
              vehicleMake: row.vehicle.make,
              vehicleModel: row.vehicle.model,
              vehicleYear: row.vehicle.year,
              plateNumber: row.vehicle.plateNumber,
              vin: row.vehicle.vin,
            };
          }

          const serviceOrderSummarySelect = {
            id: true,
            shopId: true,
            vehicleId: true,
            customerId: true,
            orderNumber: true,
            status: true,
            reportedIssue: true,
            receptionNotes: true,
            diagnosis: true,
            odometerAtIntake: true,
            fuelLevelPercent: true,
            estimatedTotal: true,
            finalTotal: true,
            receivedAt: true,
            promisedAt: true,
            deliveredAt: true,
            closedAt: true,
            assignedToUserId: true,
            customer: { select: { name: true, phone: true } },
            vehicle: { select: { make: true, model: true, year: true, plateNumber: true, vin: true } },
          } as const;

          export async function listServiceOrders(
            shopId: string,
            filters: { status?: ServiceOrderStatus; search?: string; assignedToUserId?: string } = {},
          ): Promise<ServiceOrderSummary[]> {
            const search = filters.search?.trim();
            const orders = await prisma.serviceOrder.findMany({
              where: {
                shopId,
                deletedAt: null,
                customer: { shopId },
                ...(filters.status ? { status: filters.status } : {}),
                ...(filters.assignedToUserId ? { assignedToUserId: filters.assignedToUserId } : {}),
                ...(search
                  ? {
                      OR: [
                        { orderNumber: { contains: search, mode: "insensitive" } },
                        { reportedIssue: { contains: search, mode: "insensitive" } },
                        { customer: { name: { contains: search, mode: "insensitive" } } },
                        { customer: { phone: { contains: search, mode: "insensitive" } } },
                        { vehicle: { make: { contains: search, mode: "insensitive" } } },
                        { vehicle: { model: { contains: search, mode: "insensitive" } } },
                        { vehicle: { plateNumber: { contains: search, mode: "insensitive" } } },
                        { vehicle: { vin: { contains: search, mode: "insensitive" } } },
                      ],
                    }
                  : {}),
              },
              select: serviceOrderSummarySelect,
              orderBy: { receivedAt: "desc" },
              take: 250,
            });

            return orders.map(mapServiceOrderSummary);
          }

          export async function getServiceOrderById(shopId: string, serviceOrderId: string) {
            const row = await prisma.serviceOrder.findFirst({
              where: {
                id: serviceOrderId,
                shopId,
                deletedAt: null,
                customer: { shopId },
              },
              select: serviceOrderSummarySelect,
            });
            if (!row) return null;
            const order = mapServiceOrderSummary(row);

            const [history, inspections, laborLines, partLines, quotations, approvals] = await Promise.all([
              prisma.$queryRaw<Array<{ id: string; fromStatus: string | null; toStatus: string; note: string | null; createdAt: Date }>>`
                SELECT "id", "fromStatus", "toStatus", "note", "createdAt"
                FROM "ServiceOrderStatusHistory"
                WHERE "shopId" = ${shopId}::uuid AND "serviceOrderId" = ${serviceOrderId}::uuid
                ORDER BY "createdAt" ASC
              `,
              prisma.$queryRaw<Array<{ id: string; inspectionType: string; status: string; summary: string | null; inspectedAt: Date | null; createdAt: Date }>>`
                SELECT "id", "inspectionType", "status", "summary", "inspectedAt", "createdAt"
                FROM "ServiceInspection"
                WHERE "shopId" = ${shopId}::uuid AND "serviceOrderId" = ${serviceOrderId}::uuid
                ORDER BY "createdAt" DESC
              `,
              prisma.$queryRaw<Array<Record<string, unknown>>>`
                SELECT * FROM "ServiceLaborLine"
                WHERE "shopId" = ${shopId}::uuid AND "serviceOrderId" = ${serviceOrderId}::uuid
                ORDER BY "sortOrder", "createdAt"
              `,
              prisma.$queryRaw<Array<Record<string, unknown>>>`
                SELECT spl.*, w."name" AS "warehouseName", i."sku", i."barcode"
                FROM "ServicePartLine" spl
                LEFT JOIN "Warehouse" w
                  ON w."id" = spl."warehouseId" AND w."shopId" = spl."shopId"
                LEFT JOIN "InventoryItem" i
                  ON i."id" = spl."inventoryItemId" AND i."shopId" = spl."shopId"
                WHERE spl."shopId" = ${shopId}::uuid AND spl."serviceOrderId" = ${serviceOrderId}::uuid
                ORDER BY spl."sortOrder", spl."createdAt"
              `,
              prisma.$queryRaw<Array<Record<string, unknown>>>`
                SELECT * FROM "Quotation"
                WHERE "shopId" = ${shopId}::uuid AND "serviceOrderId" = ${serviceOrderId}::uuid
                ORDER BY "revision" DESC
              `,
              prisma.$queryRaw<Array<Record<string, unknown>>>`
                SELECT * FROM "CustomerApproval"
                WHERE "shopId" = ${shopId}::uuid AND "serviceOrderId" = ${serviceOrderId}::uuid
                ORDER BY "decidedAt" DESC
              `,
            ]);

            return { ...order, history, inspections, laborLines, partLines, quotations, approvals };
          }

          export async function updateServiceOrderStatus('''

          if 'const pattern = filters.search?.trim()' in text:
              text, count = read_re.subn(read_replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'ServiceOrder read replacement count={count}')

          path.write_text(text)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit ServiceOrder Prisma reads
        run: |
          if git diff --quiet -- lib/services/autoServiceOrderService.ts; then
            echo "No service order read changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/autoServiceOrderService.ts
          git commit -m "refactor(auto): read service orders with prisma"
          git push origin HEAD:feature/auto-core-v1
