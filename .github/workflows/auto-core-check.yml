name: Massar Auto Core Check

on:
  push:
    branches:
      - main
      - feature/auto-core-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: massar-auto-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Auto route retirement checks
        run: node scripts/test-auto-core-static.cjs routes

      - name: Auto inventory boundary checks
        run: node scripts/test-auto-core-static.cjs inventory

      - name: Auto user-facing content checks
        run: node scripts/test-auto-core-static.cjs content

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
