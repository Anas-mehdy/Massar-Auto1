name: Auto schema snapshot (no deploy)

on:
  push:
    branches:
      - bootstrap/auto-schema

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: massar_auto_snapshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d massar_auto_snapshot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/massar_auto_snapshot?schema=public
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare disposable PostgreSQL roles
        run: |
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          SQL

      - name: Build Prisma baseline from validated historical schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auto-schema"
          git show 2b3d5bc049eaaeedd92e4834150a7fd2b619b53d:prisma/schema.prisma > "$RUNNER_TEMP/auto-schema/base.prisma"
          npx prisma migrate diff --from-empty --to-schema-datamodel "$RUNNER_TEMP/auto-schema/base.prisma" --script > "$RUNNER_TEMP/auto-schema/baseline.sql"
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/auto-schema/baseline.sql"

      - name: Converge SQL-managed objects from repository migrations
        shell: bash
        run: |
          set -u
          : > "$RUNNER_TEMP/auto-schema/replay-errors.log"
          for f in $(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | sort); do
            echo "=== $f ===" >> "$RUNNER_TEMP/auto-schema/replay-errors.log"
            psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -v ON_ERROR_STOP=0 -f "$f" >> "$RUNNER_TEMP/auto-schema/replay-errors.log" 2>&1 || true
          done

      - name: Validate current Prisma schema
        run: npx prisma validate

      - name: Export schema-only snapshot and fingerprints
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d massar_auto_snapshot --schema-only --no-owner --no-privileges --schema=public > "$RUNNER_TEMP/auto-schema/massar-auto-schema.sql"
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -Atc "select count(*) from pg_catalog.pg_tables where schemaname='public';" > "$RUNNER_TEMP/auto-schema/table-count.txt"
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -Atc "select tablename from pg_catalog.pg_tables where schemaname='public' order by tablename;" > "$RUNNER_TEMP/auto-schema/tables.txt"
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -AtF '|' -c "select c.relname,a.attnum,a.attname,pg_catalog.format_type(a.atttypid,a.atttypmod),a.attnotnull,coalesce(pg_get_expr(ad.adbin,ad.adrelid),'') from pg_class c join pg_namespace n on n.oid=c.relnamespace join pg_attribute a on a.attrelid=c.oid and a.attnum>0 and not a.attisdropped left join pg_attrdef ad on ad.adrelid=c.oid and ad.adnum=a.attnum where n.nspname='public' and c.relkind='r' order by c.relname,a.attnum;" > "$RUNNER_TEMP/auto-schema/columns.txt"
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -AtF '|' -c "select c.relname,con.conname,con.contype,pg_get_constraintdef(con.oid,true) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' order by c.relname,con.conname;" > "$RUNNER_TEMP/auto-schema/constraints.txt"
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -AtF '|' -c "select tablename,indexname,indexdef from pg_indexes where schemaname='public' order by tablename,indexname;" > "$RUNNER_TEMP/auto-schema/indexes.txt"
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -AtF '|' -c "select p.proname,pg_get_function_identity_arguments(p.oid),pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' order by p.proname,pg_get_function_identity_arguments(p.oid);" > "$RUNNER_TEMP/auto-schema/functions.txt"
          psql -h 127.0.0.1 -U postgres -d massar_auto_snapshot -AtF '|' -c "select c.relname,t.tgname,pg_get_triggerdef(t.oid,true) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal order by c.relname,t.tgname;" > "$RUNNER_TEMP/auto-schema/triggers.txt"
          sha256sum "$RUNNER_TEMP/auto-schema/columns.txt" "$RUNNER_TEMP/auto-schema/constraints.txt" "$RUNNER_TEMP/auto-schema/indexes.txt" > "$RUNNER_TEMP/auto-schema/fingerprints.sha256"
          echo "Schema table count: $(cat "$RUNNER_TEMP/auto-schema/table-count.txt")"
          cat "$RUNNER_TEMP/auto-schema/tables.txt"

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: massar-auto-schema-snapshot
          path: |
            ${{ runner.temp }}/auto-schema/massar-auto-schema.sql
            ${{ runner.temp }}/auto-schema/table-count.txt
            ${{ runner.temp }}/auto-schema/tables.txt
            ${{ runner.temp }}/auto-schema/columns.txt
            ${{ runner.temp }}/auto-schema/constraints.txt
            ${{ runner.temp }}/auto-schema/indexes.txt
            ${{ runner.temp }}/auto-schema/functions.txt
            ${{ runner.temp }}/auto-schema/triggers.txt
            ${{ runner.temp }}/auto-schema/fingerprints.sha256
            ${{ runner.temp }}/auto-schema/replay-errors.log
          retention-days: 1
