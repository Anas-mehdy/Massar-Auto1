name: Auto supplier return warehouse bootstrap

on:
  push:
    branches:
      - feature/auto-core-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/massar_auto_ci?schema=public
      OPENAI_API_KEY: ""
      PURCHASE_AI_MODEL: gpt-4.1-mini
      PURCHASE_AI_SHOP_DAILY_LIMIT: "6"
      PURCHASE_AI_FEATURE_BUDGET_USD: "5"
      PURCHASE_AI_MAX_OUTPUT_TOKENS: "8000"
      PURCHASE_AI_PDF_DETAIL: high
      PURCHASE_IMPORT_MAX_FILE_MB: "4"
      PURCHASE_IMPORT_MAX_PDF_PAGES: "3"
      PURCHASE_IMPORT_EXTRACTING_STALE_MINUTES: "5"
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      GROWTH_LIFECYCLE_EMAILS_ENABLED: "false"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: massar_auto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d massar_auto_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch supplier returns out of default warehouse
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/services/purchaseReceivingService.ts')
          text = path.read_text()
          if "مرتجع مورد — ${warehouse.name}" in text:
              raise SystemExit('supplier return warehouse patch already present')

          marker = '''    const supplierReturnId=returnRows[0]?.id;\n    if(!supplierReturnId) throw new Error("تعذر إنشاء مرتجع المورد.");\n\n    for(const line of prepared){'''
          replacement = '''    const supplierReturnId=returnRows[0]?.id;\n    if(!supplierReturnId) throw new Error("تعذر إنشاء مرتجع المورد.");\n    const warehouse = await ensureDefaultWarehouseTx(tx, shopId);\n\n    for(const line of prepared){'''
          if marker not in text:
              raise SystemExit('supplier return id marker not found')
          text = text.replace(marker, replacement, 1)

          marker2 = '''      const quantityAfter=line.inventoryQuantity-line.quantity;\n      // Outbound under moving average removes stock at the current average and leaves\n      // the remaining per-unit average unchanged, including when quantity reaches zero.\n      await tx.$executeRaw`UPDATE "InventoryItem" SET "quantity"=${quantityAfter},"version"="version"+1,"updatedAt"=NOW() WHERE "id"=${line.inventoryItemId}::uuid AND "shopId"=${shopId}::uuid`;'''
          replacement2 = '''      const quantityAfter=line.inventoryQuantity-line.quantity;\n      const warehouseStockRows = await tx.$queryRaw<Array<{ quantity: number; averageCost: Prisma.Decimal | null }>>`\n        SELECT "quantity", "averageCost" FROM "WarehouseStock"\n        WHERE "shopId" = ${shopId}::uuid\n          AND "warehouseId" = ${warehouse.id}::uuid\n          AND "inventoryItemId" = ${line.inventoryItemId}::uuid\n        FOR UPDATE\n      `;\n      const warehouseStock = warehouseStockRows[0];\n      if (!warehouseStock || warehouseStock.quantity < line.quantity) {\n        throw new Error(`رصيد المستودع الرئيسي غير كافٍ لإرجاع الصنف للمورد. المتاح: ${warehouseStock?.quantity ?? 0}.`);\n      }\n      const warehouseQuantityAfter = warehouseStock.quantity - line.quantity;\n      await tx.$executeRaw`\n        UPDATE "WarehouseStock"\n        SET "quantity" = ${warehouseQuantityAfter}, "updatedAt" = NOW()\n        WHERE "shopId" = ${shopId}::uuid\n          AND "warehouseId" = ${warehouse.id}::uuid\n          AND "inventoryItemId" = ${line.inventoryItemId}::uuid\n      `;\n      // Outbound under moving average removes stock at the current average and leaves\n      // the remaining per-unit average unchanged, including when quantity reaches zero.\n      await tx.$executeRaw`UPDATE "InventoryItem" SET "quantity"=${quantityAfter},"version"="version"+1,"updatedAt"=NOW() WHERE "id"=${line.inventoryItemId}::uuid AND "shopId"=${shopId}::uuid`;'''
          if marker2 not in text:
              raise SystemExit('supplier return quantity marker not found')
          text = text.replace(marker2, replacement2, 1)

          marker3 = '''      await tx.$executeRaw`\n        UPDATE "PurchaseItem" SET "returnedQuantity"="returnedQuantity"+${line.quantity},"returnedNetMerchandiseValue"="returnedNetMerchandiseValue"+${line.financialLineValue},"updatedAt"=NOW()\n        WHERE "id"=${line.id}::uuid AND "shopId"=${shopId}::uuid\n      `;'''
          replacement3 = '''      await tx.$executeRaw`\n        INSERT INTO "WarehouseMovement" (\n          "shopId", "warehouseId", "inventoryItemId", "type", "quantityChange", "quantityBefore", "quantityAfter",\n          "unitCostSnapshot", "purchaseInvoiceId", "supplierReturnId", "createdByUserId", "reference", "note", "createdAt"\n        ) VALUES (\n          ${shopId}::uuid, ${warehouse.id}::uuid, ${line.inventoryItemId}::uuid, 'SUPPLIER_RETURN', ${-line.quantity},\n          ${warehouseStock.quantity}, ${warehouseQuantityAfter}, ${line.currentAverage}, ${purchaseId}::uuid, ${supplierReturnId}::uuid,\n          ${userId}::uuid, ${nullableText(input.reference)}, ${`مرتجع مورد — ${warehouse.name}: ${reason}`}, ${returnedAt}\n        )\n      `;\n      await tx.$executeRaw`\n        UPDATE "PurchaseItem" SET "returnedQuantity"="returnedQuantity"+${line.quantity},"returnedNetMerchandiseValue"="returnedNetMerchandiseValue"+${line.financialLineValue},"updatedAt"=NOW()\n        WHERE "id"=${line.id}::uuid AND "shopId"=${shopId}::uuid\n      `;'''
          if marker3 not in text:
              raise SystemExit('supplier return PurchaseItem marker not found')
          text = text.replace(marker3, replacement3, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate
      - name: Purchase static safeguards
        run: |
          node scripts/test-purchase-receiving-phase4-static.cjs
          node scripts/test-purchase-receiving-lifecycle.cjs
          node scripts/test-purchase-legacy-cost-compat-static.cjs
          node scripts/test-supplier-ledger-static.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Full application build
        run: npm run build
      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/purchaseReceivingService.ts
          git commit -m "feat(auto): return supplier stock from default warehouse"
          git push origin HEAD:feature/auto-core-v1
