name: Auto purchase warehouse bootstrap

on:
  push:
    branches:
      - feature/auto-core-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/massar_auto_ci?schema=public
      OPENAI_API_KEY: ""
      PURCHASE_AI_MODEL: gpt-4.1-mini
      PURCHASE_AI_SHOP_DAILY_LIMIT: "6"
      PURCHASE_AI_FEATURE_BUDGET_USD: "5"
      PURCHASE_AI_MAX_OUTPUT_TOKENS: "8000"
      PURCHASE_AI_PDF_DETAIL: high
      PURCHASE_IMPORT_MAX_FILE_MB: "4"
      PURCHASE_IMPORT_MAX_PDF_PAGES: "3"
      PURCHASE_IMPORT_EXTRACTING_STALE_MINUTES: "5"
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      GROWTH_LIFECYCLE_EMAILS_ENABLED: "false"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: massar_auto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d massar_auto_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch purchase receipts into default warehouse
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/services/purchaseReceivingService.ts')
          text = path.read_text()
          if 'async function ensureDefaultWarehouseTx(' in text:
              raise SystemExit('warehouse purchase patch already present')

          marker = 'async function createReceiptTx(\n'
          helper = '''async function ensureDefaultWarehouseTx(tx: Prisma.TransactionClient, shopId: string) {\n  const existing = await tx.$queryRaw<Array<{ id: string; name: string }>>`\n    SELECT "id", "name" FROM "Warehouse"\n    WHERE "shopId" = ${shopId}::uuid AND "deletedAt" IS NULL AND "isDefault" = TRUE AND "isActive" = TRUE\n    LIMIT 1\n    FOR UPDATE\n  `;\n  if (existing[0]) return existing[0];\n\n  await tx.$queryRaw<Array<{ id: string }>>`SELECT "id" FROM "Shop" WHERE "id" = ${shopId}::uuid FOR UPDATE`;\n  const secondCheck = await tx.$queryRaw<Array<{ id: string; name: string }>>`\n    SELECT "id", "name" FROM "Warehouse"\n    WHERE "shopId" = ${shopId}::uuid AND "deletedAt" IS NULL AND "isDefault" = TRUE AND "isActive" = TRUE\n    LIMIT 1\n  `;\n  if (secondCheck[0]) return secondCheck[0];\n\n  const rows = await tx.$queryRaw<Array<{ id: string; name: string }>>`\n    INSERT INTO "Warehouse" ("shopId", "code", "name", "isDefault", "isActive")\n    VALUES (${shopId}::uuid, 'MAIN', 'المستودع الرئيسي', TRUE, TRUE)\n    RETURNING "id", "name"\n  `;\n  return rows[0];\n}\n\n'''
          if marker not in text:
              raise SystemExit('createReceiptTx marker not found')
          text = text.replace(marker, helper + marker, 1)

          receipt_marker = '''  const receiptId = receiptRows[0]?.id;\n  if (!receiptId) throw new Error("تعذر إنشاء سجل الاستلام.");\n\n  for (const line of positiveLines) {'''
          receipt_replacement = '''  const receiptId = receiptRows[0]?.id;\n  if (!receiptId) throw new Error("تعذر إنشاء سجل الاستلام.");\n  const warehouse = await ensureDefaultWarehouseTx(tx, input.shopId);\n\n  for (const line of positiveLines) {'''
          if receipt_marker not in text:
              raise SystemExit('receipt marker not found')
          text = text.replace(receipt_marker, receipt_replacement, 1)

          quantity_marker = '''    const quantityAfter = inventory.quantity + line.quantity;\n\n    await tx.$executeRaw`'''
          quantity_replacement = '''    const quantityAfter = inventory.quantity + line.quantity;\n\n    await tx.$executeRaw`\n      INSERT INTO "WarehouseStock" ("shopId", "warehouseId", "inventoryItemId", "quantity", "reservedQuantity", "reorderLevel", "averageCost")\n      VALUES (${input.shopId}::uuid, ${warehouse.id}::uuid, ${line.inventoryItemId}::uuid, 0, 0, 0, ${inventory.unitCost})\n      ON CONFLICT ("warehouseId", "inventoryItemId") DO NOTHING\n    `;\n    const warehouseStockRows = await tx.$queryRaw<Array<{ quantity: number; averageCost: Prisma.Decimal | null }>>`\n      SELECT "quantity", "averageCost" FROM "WarehouseStock"\n      WHERE "shopId" = ${input.shopId}::uuid\n        AND "warehouseId" = ${warehouse.id}::uuid\n        AND "inventoryItemId" = ${line.inventoryItemId}::uuid\n      FOR UPDATE\n    `;\n    const warehouseStock = warehouseStockRows[0];\n    if (!warehouseStock) throw new Error("تعذر تهيئة رصيد القطعة في المستودع الرئيسي.");\n    const warehouseAverage = movingWeightedAverage({\n      currentQuantity: warehouseStock.quantity,\n      currentAverageCost: warehouseStock.averageCost,\n      receivedQuantity: line.quantity,\n      receivedCapitalizedValue: capitalizedValue,\n    });\n    const warehouseQuantityAfter = warehouseStock.quantity + line.quantity;\n\n    await tx.$executeRaw`\n      UPDATE "WarehouseStock"\n      SET "quantity" = ${warehouseQuantityAfter}, "averageCost" = ${warehouseAverage}, "updatedAt" = NOW()\n      WHERE "shopId" = ${input.shopId}::uuid\n        AND "warehouseId" = ${warehouse.id}::uuid\n        AND "inventoryItemId" = ${line.inventoryItemId}::uuid\n    `;\n\n    await tx.$executeRaw`'''
          if quantity_marker not in text:
              raise SystemExit('quantity marker not found')
          text = text.replace(quantity_marker, quantity_replacement, 1)

          movement_marker = '''    await tx.$executeRaw`\n      UPDATE "PurchaseItem" SET'''
          movement_insert = '''    await tx.$executeRaw`\n      INSERT INTO "WarehouseMovement" (\n        "shopId", "warehouseId", "inventoryItemId", "type", "quantityChange", "quantityBefore", "quantityAfter",\n        "unitCostSnapshot", "purchaseInvoiceId", "createdByUserId", "reference", "note", "createdAt"\n      ) VALUES (\n        ${input.shopId}::uuid, ${warehouse.id}::uuid, ${line.inventoryItemId}::uuid, 'PURCHASE_IN', ${line.quantity},\n        ${warehouseStock.quantity}, ${warehouseQuantityAfter}, ${inboundUnitCost}, ${input.purchase.id}::uuid, ${input.userId}::uuid,\n        ${input.purchase.supplierInvoiceNumber}, ${`استلام شراء — ${warehouse.name}`}, ${input.receivedAt}\n      )\n    `;\n\n    await tx.$executeRaw`\n      UPDATE "PurchaseItem" SET'''
          if movement_marker not in text:
              raise SystemExit('movement marker not found')
          text = text.replace(movement_marker, movement_insert, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Purchase static safeguards
        run: |
          node scripts/test-purchase-receiving-phase4-static.cjs
          node scripts/test-purchase-receiving-lifecycle.cjs
          node scripts/test-purchase-legacy-cost-compat-static.cjs
          node scripts/test-supplier-ledger-static.cjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Full application build
        run: npm run build

      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/purchaseReceivingService.ts
          git commit -m "feat(auto): receive purchases into default warehouse"
          git push origin HEAD:feature/auto-core-v1
