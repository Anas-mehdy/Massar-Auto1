name: Fix bank movement database clock on preview

on:
  push:
    branches:
      - preview/purchase-receiving
    paths:
      - .github/workflows/fix-bank-clock.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/massar_bank_clock_verify?schema=public
      OPENAI_API_KEY: ""
      PURCHASE_AI_MODEL: gpt-4.1-mini
      PURCHASE_AI_SHOP_DAILY_LIMIT: "6"
      PURCHASE_AI_FEATURE_BUDGET_USD: "5"
      PURCHASE_AI_MAX_OUTPUT_TOKENS: "8000"
      PURCHASE_AI_PDF_DETAIL: high
      PURCHASE_IMPORT_MAX_FILE_MB: "4"
      PURCHASE_IMPORT_MAX_PDF_PAGES: "3"
      PURCHASE_IMPORT_EXTRACTING_STALE_MINUTES: "5"
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      GROWTH_LIFECYCLE_EMAILS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/purchase-receiving
          fetch-depth: 0

      - name: Apply database-clock fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          service_path = Path('lib/services/bankAccountService.ts')
          service = service_path.read_text()

          old = '''function validDate(value: Date | undefined) {
            const date = value ?? new Date();
            if (Number.isNaN(date.getTime())) throw new Error("تاريخ الحركة غير صالح.");
            return date;
          }'''
          new = '''function validDate(value: Date | undefined) {
            if (!value) return undefined;
            if (Number.isNaN(value.getTime())) throw new Error("تاريخ الحركة غير صالح.");
            return value;
          }'''
          assert service.count(old) == 1, 'validDate context changed'
          service = service.replace(old, new)

          old = '''  const amount = positiveAmount(input.amount);
            const occurredAt = validDate(input.occurredAt);
            const account = await lockBankAccountTx(tx, shopId, input.bankAccountId, input.requireActiveAccount !== false);'''
          new = '''  const amount = positiveAmount(input.amount);
            const occurredAt = validDate(input.occurredAt) ?? null;
            const account = await lockBankAccountTx(tx, shopId, input.bankAccountId, input.requireActiveAccount !== false);'''
          assert service.count(old) == 1, 'create movement timestamp context changed'
          service = service.replace(old, new)

          old = '''      ${nullableText(input.counterpartyId)}, ${nullableText(input.counterpartyName)}, ${input.transferGroupId ?? null}::uuid,
                ${occurredAt}
              )'''
          new = '''      ${nullableText(input.counterpartyId)}, ${nullableText(input.counterpartyName)}, ${input.transferGroupId ?? null}::uuid,
                COALESCE(${occurredAt}::timestamp, NOW()::timestamp)
              )'''
          assert service.count(old) == 1, 'bank movement INSERT timestamp context changed'
          service = service.replace(old, new)

          old = '''  const occurredAt = validDate(input.occurredAt);
            const note = nullableText(input.note);
            const reference = nullableText(input.reference);

            return prisma.$transaction(async (tx) => {
              const groupRows = await tx.$queryRaw<Array<{ id: string }>>`SELECT gen_random_uuid()::text AS "id"`;
              const groupId = groupRows[0]?.id;
              if (!groupId) throw new Error("تعذر إنشاء مرجع التحويل.");'''
          new = '''  const requestedOccurredAt = validDate(input.occurredAt);
            const note = nullableText(input.note);
            const reference = nullableText(input.reference);

            return prisma.$transaction(async (tx) => {
              const groupRows = await tx.$queryRaw<Array<{ id: string; occurredAt: Date }>>`
                SELECT gen_random_uuid()::text AS "id", NOW()::timestamp AS "occurredAt"
              `;
              const groupId = groupRows[0]?.id;
              const occurredAt = requestedOccurredAt ?? groupRows[0]?.occurredAt;
              if (!groupId || !occurredAt) throw new Error("تعذر إنشاء مرجع أو وقت التحويل.");'''
          assert service.count(old) == 1, 'transfer timestamp context changed'
          service = service.replace(old, new)
          service_path.write_text(service)

          actions_path = Path('app/bank-accounts/actions.ts')
          actions = actions_path.read_text()
          old = 'import { timeZoneForCountry, zonedDateTimeToUtc } from "@/lib/timezone";'
          new = 'import { localDateString, timeZoneForCountry, zonedDateTimeToUtc } from "@/lib/timezone";'
          assert actions.count(old) == 1, 'timezone import context changed'
          actions = actions.replace(old, new)

          old = '''function dateOrNow(value: string | undefined, timeZone: string) {
            if (!value?.trim()) return new Date();
            const match = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(value.trim());
            if (!match) throw new Error("تاريخ الحركة غير صحيح.");
            const [year, month, day] = match.slice(1).map(Number);
            const check = new Date(Date.UTC(year, month - 1, day));
            if (check.getUTCFullYear() !== year || check.getUTCMonth() + 1 !== month || check.getUTCDate() !== day) throw new Error("تاريخ الحركة غير صحيح.");
            return zonedDateTimeToUtc({ year, month, day, hour: 12 }, timeZone);
          }'''
          new = '''function dateOrNow(value: string | undefined, timeZone: string) {
            if (!value?.trim()) return undefined;
            const match = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(value.trim());
            if (!match) throw new Error("تاريخ الحركة غير صحيح.");
            const [year, month, day] = match.slice(1).map(Number);
            const check = new Date(Date.UTC(year, month - 1, day));
            if (check.getUTCFullYear() !== year || check.getUTCMonth() + 1 !== month || check.getUTCDate() !== day) throw new Error("تاريخ الحركة غير صحيح.");
            const normalized = `${String(year).padStart(4, "0")}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            if (normalized === localDateString(new Date(), timeZone)) return undefined;
            return zonedDateTimeToUtc({ year, month, day, hour: 12 }, timeZone);
          }'''
          assert actions.count(old) == 1, 'dateOrNow context changed'
          actions = actions.replace(old, new)
          actions_path.write_text(actions)

          assert 'COALESCE(${occurredAt}::timestamp, NOW()::timestamp)' in service
          assert 'NOW()::timestamp AS "occurredAt"' in service
          assert 'if (!value?.trim()) return undefined;' in actions
          print('BANK_DB_CLOCK_FIX_APPLIED')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Full application build
        run: npm run build

      - name: Commit clean fix to preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-bank-clock.yml
          git add app/bank-accounts/actions.ts lib/services/bankAccountService.ts
          git diff --cached --check
          git commit -m "fix(finance): use database clock for bank movements"
          git push origin HEAD:preview/purchase-receiving
