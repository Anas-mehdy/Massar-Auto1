name: Auto service parts warehouse bootstrap

on:
  push:
    branches:
      - feature/auto-core-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-core-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch service-part warehouse integration
        run: python3 scripts/patch-auto-service-parts.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Prisma and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Full application build
        run: npm run build

      - name: Commit verified service-part integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/autoServiceOrderService.ts lib/services/quotationService.ts app/service-orders/actions.ts 'app/service-orders/[id]/page.tsx'
          git commit -m "feat(auto): reserve and consume service parts by warehouse"
          git push origin HEAD:feature/auto-core-v1
