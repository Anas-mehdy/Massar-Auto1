name: Apply bank accounts to preview

on:
  push:
    branches:
      - preview/purchase-receiving
    paths:
      - '.bank-staging/ready-v4'

permissions:
  contents: write

concurrency:
  group: bank-accounts-preview-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: massar_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d massar_preview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/massar_preview?schema=public
      EXPECTED_PREVIEW_BASE: 0c50c15f46909691485f4d0ff4a4c03302f93a97
      EXPECTED_MAIN_HEAD: 65c73b7f74b10501cfe4b89edc664e541139dba4
      OPENAI_API_KEY: ""
      PURCHASE_AI_MODEL: gpt-4.1-mini
      PURCHASE_AI_SHOP_DAILY_LIMIT: "6"
      PURCHASE_AI_FEATURE_BUDGET_USD: "5"
      PURCHASE_AI_MAX_OUTPUT_TOKENS: "8000"
      PURCHASE_AI_PDF_DETAIL: high
      PURCHASE_IMPORT_MAX_FILE_MB: "4"
      PURCHASE_IMPORT_MAX_PDF_PAGES: "3"
      PURCHASE_IMPORT_EXTRACTING_STALE_MINUTES: "5"
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      GROWTH_LIFECYCLE_EMAILS_ENABLED: "false"
    steps:
      - name: Checkout preview staging commit
        uses: actions/checkout@v4
        with:
          ref: preview/purchase-receiving
          fetch-depth: 0

      - name: Verify staging ancestry and decode payload
        shell: bash
        run: |
          set -euo pipefail
          STAGING_HEAD="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_PREVIEW_BASE" "$STAGING_HEAD"
          files=(
            .bank-staging/payload.part.00
            .bank-staging/payload.part.01
            .bank-staging/payload.part.02
            .bank-staging/payload.part.03.00
            .bank-staging/payload.part.03.01
            .bank-staging/payload.part.03.02
            .bank-staging/payload.part.03.03
            .bank-staging/payload.part.04
            .bank-staging/payload.part.05
            .bank-staging/payload.part.06
            .bank-staging/payload.part.07.00
            .bank-staging/payload.part.07.01
            .bank-staging/payload.part.07.02
            .bank-staging/payload.part.07.03
            .bank-staging/payload.part.08
            .bank-staging/payload.part.09
            .bank-staging/payload.part.10
          )
          test -f .bank-staging/ready-v4
          test -f .bank-staging/rebuild-prisma.py
          for f in "${files[@]}"; do test -f "$f"; done
          mkdir -p /tmp/massar-bank
          cat "${files[@]}" | base64 -d > /tmp/massar-bank/payload.tar.gz
          tar -xzf /tmp/massar-bank/payload.tar.gz -C /tmp/massar-bank
          test -x /tmp/massar-bank/bank-staging-payload/apply.py
          cp .bank-staging/rebuild-prisma.py /tmp/massar-bank/rebuild-prisma.py
          echo "STAGING_HEAD=$STAGING_HEAD" >> "$GITHUB_ENV"

      - name: Align reviewed patch context with current main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'expected {label} patch context not found: {old[:100]}')
              return text.replace(old, new, 1)

          sales = Path('/tmp/massar-bank/bank-staging-payload/patches/sales-bank-integration.patch')
          s = sales.read_text()
          for old, new in [
            (
              '-      if (changeAmount.gt(0)) await moneyAccountService.applyOutgoingMoneyTx(tx, shopId, createdByUserId, { destination: changeDestination, walletId: input.changeWalletId, amount: changeAmount, reference: sale.receiptNumber, description: `إرجاع باقي للعميل من بيع ${sale.receiptNumber}`, source: { ...sourceBase, sourceType: "SALE" } });',
              '-      if (changeAmount.gt(0)) await moneyAccountService.applyOutgoingMoneyTx(tx, shopId, createdByUserId, { destination: changeDestination, walletId: input.changeWalletId, amount: changeAmount, reference: sale.receiptNumber, description: `إرجاع باقي للعميل من بيع ${sale.receiptNumber}`, source: { ...sourceBase, sourceType: "SALE_CHANGE" } });'
            ),
            (
              '-        <SalePaymentFields total={total} wallets={wallets} currency={currency} debtEligible={debtEligible} />',
              '-          <SalePaymentFields total={Math.max(0, total)} wallets={wallets} currency={currency} debtEligible={customerMode === "NEW" || (customerMode === "EXISTING" && Boolean(selectedCustomer))} />'
            ),
            (
              '+        <SalePaymentFields total={total} wallets={wallets} bankAccounts={bankAccounts} currency={currency} debtEligible={debtEligible} />',
              '+          <SalePaymentFields total={Math.max(0, total)} wallets={wallets} bankAccounts={bankAccounts} currency={currency} debtEligible={customerMode === "NEW" || (customerMode === "EXISTING" && Boolean(selectedCustomer))} />'
            ),
          ]:
              s = replace_required(s, old, new, 'sales')
          sales.write_text(s)

          electronic = Path('/tmp/massar-bank/bank-staging-payload/patches/electronic-services-bank-integration.patch')
          e = electronic.read_text()
          for old, new in [
            (
              '-      <ElectronicServiceExecutionForm providers={providers} templates={templates} customers={customers} wallets={wallets} defaultCurrency={context.currency} defaultProviderId={query.provider} />',
              '-      <div className="rounded-[24px] border border-slate-200/80 bg-white p-5 shadow-[0_18px_55px_-38px_rgba(15,23,42,0.28)] dark:border-slate-800 dark:bg-slate-950 sm:p-6"><ElectronicServiceExecutionForm providers={providers} templates={templates} customers={customers} wallets={wallets} defaultCurrency={context.currency} defaultProviderId={query.provider} /></div>'
            ),
            (
              '+      <ElectronicServiceExecutionForm providers={providers} templates={templates} customers={customers} wallets={wallets} bankAccounts={bankAccounts} defaultCurrency={context.currency} defaultProviderId={query.provider} />',
              '+      <div className="rounded-[24px] border border-slate-200/80 bg-white p-5 shadow-[0_18px_55px_-38px_rgba(15,23,42,0.28)] dark:border-slate-800 dark:bg-slate-950 sm:p-6"><ElectronicServiceExecutionForm providers={providers} templates={templates} customers={customers} wallets={wallets} bankAccounts={bankAccounts} defaultCurrency={context.currency} defaultProviderId={query.provider} /></div>'
            ),
          ]:
              e = replace_required(e, old, new, 'electronic')
          electronic.write_text(e)

          purchase = Path('/tmp/massar-bank/bank-staging-payload/patches/purchase-bank-integration.patch')
          p = purchase.read_text()
          p = replace_required(
              p,
              '   paymentAccountType: z.enum(["DRAWER", "WALLET", "BANK", "OTHER"]).nullable().optional(),\n   paymentWalletId: z.string().uuid().nullable().optional(),\n+  paymentBankAccountId: z.string().uuid().nullable().optional(),',
              '-  paymentAccountType: z.enum(["DRAWER", "WALLET", "OTHER"]).nullable().optional(),\n+  paymentAccountType: z.enum(["DRAWER", "WALLET", "BANK", "OTHER"]).nullable().optional(),\n   paymentWalletId: z.string().uuid().nullable().optional(),\n+  paymentBankAccountId: z.string().uuid().nullable().optional(),',
              'purchase actions'
          )
          purchase.write_text(p)
          PY

      - name: Fetch and verify latest main used by review
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"
          test "$MAIN_HEAD" = "$EXPECTED_MAIN_HEAD"
          echo "MAIN_HEAD=$MAIN_HEAD" >> "$GITHUB_ENV"

      - name: Build final working tree from latest main plus bank feature
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$MAIN_HEAD"
          python3 /tmp/massar-bank/bank-staging-payload/apply.py --payload /tmp/massar-bank/bank-staging-payload
          git status --short

      - name: Rebuild Prisma schema bank additions from exact main models
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/massar-bank/rebuild-prisma.py "$MAIN_HEAD"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create Supabase-compatible roles in disposable Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d massar_preview -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          SQL

      - name: Verify bank migration over exact main baseline
        shell: bash
        run: |
          set -euo pipefail
          ci_schema_dir="$RUNNER_TEMP/massar-bank-ci/prisma"
          mkdir -p "$ci_schema_dir/migrations/00000000000000_main_schema_baseline"
          mkdir -p "$ci_schema_dir/migrations/00000000000001_electronic_service_fixture"
          git show "$MAIN_HEAD:prisma/schema.prisma" > "$ci_schema_dir/main.prisma"
          npx prisma migrate diff --from-empty --to-schema-datamodel "$ci_schema_dir/main.prisma" --script > "$ci_schema_dir/migrations/00000000000000_main_schema_baseline/migration.sql"
          cat > "$ci_schema_dir/migrations/00000000000001_electronic_service_fixture/migration.sql" <<'SQL'
          CREATE TABLE IF NOT EXISTS "ElectronicServiceTransaction" (
            "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            "paymentDestination" VARCHAR(20) NOT NULL DEFAULT 'OTHER',
            CONSTRAINT "ElectronicServiceTransaction_paymentDestination_check"
              CHECK ("paymentDestination" IN ('DRAWER','WALLET','OTHER','DEBT'))
          );
          SQL
          cp prisma/schema.prisma "$ci_schema_dir/schema.prisma"
          cp prisma/migrations/migration_lock.toml "$ci_schema_dir/migrations/migration_lock.toml"
          cp -R prisma/migrations/20260909220000_bank_accounts "$ci_schema_dir/migrations/"
          npx prisma migrate deploy --schema "$ci_schema_dir/schema.prisma"

          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d massar_preview -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE check_def text;
          BEGIN
            IF to_regclass('"BankAccount"') IS NULL THEN RAISE EXCEPTION 'BankAccount missing'; END IF;
            IF to_regclass('"BankAccountMovement"') IS NULL THEN RAISE EXCEPTION 'BankAccountMovement missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='PurchaseInvoice' AND column_name='paymentBankAccountId') THEN RAISE EXCEPTION 'PurchaseInvoice.paymentBankAccountId missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='PurchasePayment' AND column_name='bankAccountId') THEN RAISE EXCEPTION 'PurchasePayment.bankAccountId missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='SupplierReturnSettlement' AND column_name='bankAccountId') THEN RAISE EXCEPTION 'SupplierReturnSettlement.bankAccountId missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='Expense' AND column_name='fundingBankAccountId') THEN RAISE EXCEPTION 'Expense.fundingBankAccountId missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='ElectronicServiceTransaction' AND column_name='bankAccountId') THEN RAISE EXCEPTION 'ElectronicServiceTransaction.bankAccountId missing'; END IF;
            SELECT pg_get_constraintdef(oid) INTO check_def FROM pg_constraint WHERE conname='ElectronicServiceTransaction_paymentDestination_check';
            IF check_def IS NULL OR position('BANK' in check_def)=0 THEN RAISE EXCEPTION 'ElectronicServiceTransaction BANK check missing'; END IF;
          END $$;
          SQL
          echo BANK_MIGRATION_BASELINE_OK

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Bank ledger regression suite
        run: node /tmp/massar-bank/bank-staging-payload/regression-bank-ledger.mjs

      - name: Full application build
        run: npm run build

      - name: Create clean merge commit and fast-forward preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE_SHA="$(git write-tree)"
          FINAL_SHA="$(printf '%s\n' 'feat(finance): add integrated bank accounts' | git commit-tree "$TREE_SHA" -p "$STAGING_HEAD" -p "$MAIN_HEAD")"
          git push origin "$FINAL_SHA:refs/heads/preview/purchase-receiving"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "Final preview commit: $FINAL_SHA"
