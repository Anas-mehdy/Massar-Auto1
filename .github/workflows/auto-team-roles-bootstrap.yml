name: Auto team roles bootstrap

on:
  push:
    branches:
      - feature/auto-core-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/massar_auto_ci?schema=public
      OPENAI_API_KEY: ""
      PURCHASE_AI_MODEL: gpt-4.1-mini
      PURCHASE_AI_SHOP_DAILY_LIMIT: "6"
      PURCHASE_AI_FEATURE_BUDGET_USD: "5"
      PURCHASE_AI_MAX_OUTPUT_TOKENS: "8000"
      PURCHASE_AI_PDF_DETAIL: high
      PURCHASE_IMPORT_MAX_FILE_MB: "4"
      PURCHASE_IMPORT_MAX_PDF_PAGES: "3"
      PURCHASE_IMPORT_EXTRACTING_STALE_MINUTES: "5"
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      GROWTH_LIFECYCLE_EMAILS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-core-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply automotive role patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "prisma/schema.prisma",
              '''enum MembershipRole {\n  OWNER // مالك المتجر: تحكم كامل بالمتجر والموظفين والاشتراكات\n  ADMIN // مدير الفرع: إدارة العمليات والمخزون والفريق (دون الفوترة وحذف المتجر)\n  TECHNICIAN // فني صيانة: إنشاء وتعديل تذاكر الصيانة وقطع الغيار\n  VIEWER // مشاهد: قراءة التقارير والتذاكر دون تعديل\n}''',
              '''enum MembershipRole {\n  OWNER // مالك المركز: تحكم كامل بالنظام والفريق والاشتراكات\n  ADMIN // مدير المركز/الفرع: إدارة العمليات والمخزون والفريق دون إعدادات المالك\n  RECEPTIONIST // موظف استقبال: العملاء والمركبات وأوامر الصيانة وعروض الأسعار\n  TECHNICIAN // فني صيانة: تنفيذ أوامر الصيانة واستخدام قطع الغيار\n  WAREHOUSE // أمين مستودع: المخزون والمستودعات والجرد والحركات\n  FINANCE // محاسب: الفواتير والذمم والمصروفات والسندات والإقفال اليومي\n  VIEWER // مشاهد: قراءة التقارير والعمليات دون تعديل\n}'''
          )

          permissions_path = Path("lib/auth/permissions.ts")
          permissions = permissions_path.read_text()
          permissions = permissions.replace(
              '''/**\n * Transitional mapping. New automotive role presets (manager/receptionist/\n * warehouse/finance) will be added after the Prisma membership enum is migrated.\n */''',
              '''/**\n * Automotive role presets. ADMIN acts as the workshop/branch manager while\n * RECEPTIONIST, TECHNICIAN, WAREHOUSE and FINANCE are least-privilege presets.\n */'''
          )
          marker = '''  VIEWER: [\n    "repairs:read",'''
          if permissions.count(marker) != 1:
              raise SystemExit("permissions.ts: VIEWER marker not found exactly once")
          automotive_roles = '''  RECEPTIONIST: [\n    "repairs:read",\n    "repairs:create",\n    "repairs:update",\n    "repairs:update_status",\n    "vehicles:read",\n    "vehicles:manage",\n    "service_orders:read",\n    "service_orders:create",\n    "service_orders:update",\n    "service_orders:update_status",\n    "quotes:read",\n    "quotes:manage",\n    "sales:read",\n    "sales:create",\n    "inventory:read",\n    "inventory:use_parts",\n    "warehouse:read",\n    "invoices:read",\n    "invoices:pay",\n    "customers:manage",\n    "reports:read",\n    "team:read",\n  ],\n\n  WAREHOUSE: [\n    "sales:read",\n    "inventory:read",\n    "inventory:use_parts",\n    "inventory:manage",\n    "inventory:adjust",\n    "warehouse:read",\n    "warehouse:manage",\n    "warehouse:transfer",\n    "warehouse:stocktake",\n    "suppliers:manage",\n    "reports:read",\n    "team:read",\n  ],\n\n  FINANCE: [\n    "sales:read",\n    "sales:create",\n    "sales:cancel",\n    "sales:return",\n    "invoices:read",\n    "invoices:pay",\n    "invoices:void",\n    "customers:manage",\n    "suppliers:manage",\n    "reports:read",\n    "expenses:manage",\n    "debts:manage",\n    "finance:vouchers",\n    "cash:close",\n    "team:read",\n  ],\n\n'''
          permissions = permissions.replace(marker, automotive_roles + marker)
          permissions_path.write_text(permissions)

          team_service = Path("lib/services/teamService.ts")
          service = team_service.read_text()
          old_allowed = '''  const allowedRoles: MembershipRole[] = [\n    MembershipRole.ADMIN,\n    MembershipRole.TECHNICIAN,\n    MembershipRole.VIEWER,\n  ];'''
          new_allowed = '''  const allowedRoles: MembershipRole[] = [\n    MembershipRole.ADMIN,\n    MembershipRole.RECEPTIONIST,\n    MembershipRole.TECHNICIAN,\n    MembershipRole.WAREHOUSE,\n    MembershipRole.FINANCE,\n    MembershipRole.VIEWER,\n  ];'''
          if service.count(old_allowed) != 2:
              raise SystemExit(f"teamService.ts: expected 2 allowed-role blocks, found {service.count(old_allowed)}")
          service = service.replace(old_allowed, new_allowed)
          service = service.replace(
              'throw new Error("لا يمكن إنشاء أو دعوة مالك متجر جديد. يمكنك فقط دعوة مدير أو فني أو مشاهد.");',
              'throw new Error("لا يمكن إنشاء أو دعوة مالك جديد. اختر مديراً أو استقبالاً أو فنياً أو مستودعاً أو محاسباً أو مشاهداً.");'
          )
          team_service.write_text(service)

          ui = Path("app/settings/_team-section.tsx")
          text = ui.read_text()
          technician_display = '''  TECHNICIAN: {\n    label: "فني صيانة",\n    colorClass: "text-teal-800",\n    bgClass: "bg-teal-50",\n    borderClass: "border-teal-200",\n  },'''
          role_display_expanded = technician_display + '''\n  RECEPTIONIST: {\n    label: "موظف استقبال",\n    colorClass: "text-cyan-800",\n    bgClass: "bg-cyan-50",\n    borderClass: "border-cyan-200",\n  },\n  WAREHOUSE: {\n    label: "أمين مستودع",\n    colorClass: "text-amber-800",\n    bgClass: "bg-amber-50",\n    borderClass: "border-amber-200",\n  },\n  FINANCE: {\n    label: "محاسب / مالية",\n    colorClass: "text-emerald-800",\n    bgClass: "bg-emerald-50",\n    borderClass: "border-emerald-200",\n  },'''
          if text.count(technician_display) != 1:
              raise SystemExit("team UI: technician display block not found exactly once")
          text = text.replace(technician_display, role_display_expanded)

          invite_options = '''                    <option value={MembershipRole.TECHNICIAN}>فني صيانة (TECHNICIAN) — إنشاء وتحديث طلبات الصيانة</option>\n                    <option value={MembershipRole.ADMIN}>مدير فرع (ADMIN) — إدارة كاملة للعمليات والمخزون والفريق</option>\n                    <option value={MembershipRole.VIEWER}>مشاهد تقارير (VIEWER) — قراءة فقط دون تعديل أو حذف</option>'''
          invite_options_new = '''                    <option value={MembershipRole.RECEPTIONIST}>موظف استقبال (RECEPTIONIST) — العملاء والمركبات وأوامر الصيانة وعروض الأسعار</option>\n                    <option value={MembershipRole.TECHNICIAN}>فني صيانة (TECHNICIAN) — تنفيذ وتحديث أوامر الصيانة واستخدام القطع</option>\n                    <option value={MembershipRole.WAREHOUSE}>أمين مستودع (WAREHOUSE) — المخزون والمستودعات والجرد</option>\n                    <option value={MembershipRole.FINANCE}>محاسب / مالية (FINANCE) — الفواتير والذمم والمصروفات والإقفال</option>\n                    <option value={MembershipRole.ADMIN}>مدير فرع (ADMIN) — إدارة كاملة للعمليات والمخزون والفريق</option>\n                    <option value={MembershipRole.VIEWER}>مشاهد تقارير (VIEWER) — قراءة فقط دون تعديل أو حذف</option>'''
          if text.count(invite_options) != 1:
              raise SystemExit("team UI: invite options block not found exactly once")
          text = text.replace(invite_options, invite_options_new)

          edit_options = '''                  <option value={MembershipRole.ADMIN}>مدير فرع (ADMIN)</option>\n                  <option value={MembershipRole.TECHNICIAN}>فني صيانة (TECHNICIAN)</option>\n                  <option value={MembershipRole.VIEWER}>مشاهد تقارير (VIEWER)</option>'''
          edit_options_new = '''                  <option value={MembershipRole.ADMIN}>مدير فرع (ADMIN)</option>\n                  <option value={MembershipRole.RECEPTIONIST}>موظف استقبال (RECEPTIONIST)</option>\n                  <option value={MembershipRole.TECHNICIAN}>فني صيانة (TECHNICIAN)</option>\n                  <option value={MembershipRole.WAREHOUSE}>أمين مستودع (WAREHOUSE)</option>\n                  <option value={MembershipRole.FINANCE}>محاسب / مالية (FINANCE)</option>\n                  <option value={MembershipRole.VIEWER}>مشاهد تقارير (VIEWER)</option>'''
          if text.count(edit_options) != 1:
              raise SystemExit("team UI: edit options block not found exactly once")
          text = text.replace(edit_options, edit_options_new)
          text = text.replace(
              "إدارة الفنيين والمديرين والصلاحيات المرتبطة بهذا الفرع",
              "إدارة الاستقبال والفنيين والمستودع والمالية والصلاحيات المرتبطة بهذا الفرع"
          )
          ui.write_text(text)

          migration_dir = Path("prisma/migrations/20260911123000_add_auto_membership_roles")
          migration_dir.mkdir(parents=True, exist_ok=True)
          (migration_dir / "migration.sql").write_text('''-- Automotive workshop team roles.\n-- This migration belongs to the independent Massar Auto database only.\nALTER TYPE "MembershipRole" ADD VALUE IF NOT EXISTS 'RECEPTIONIST';\nALTER TYPE "MembershipRole" ADD VALUE IF NOT EXISTS 'WAREHOUSE';\nALTER TYPE "MembershipRole" ADD VALUE IF NOT EXISTS 'FINANCE';\n''')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Prisma and generate client
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Full application build
        run: npm run build

      - name: Commit verified role changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma prisma/migrations/20260911123000_add_auto_membership_roles/migration.sql lib/auth/permissions.ts lib/services/teamService.ts app/settings/_team-section.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(auto): add workshop team roles"
          git push origin HEAD:feature/auto-core-v1
