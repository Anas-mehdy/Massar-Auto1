name: Fix supplier bank payments on preview

on:
  push:
    branches:
      - preview/purchase-receiving
    paths:
      - .supplier-bank-fix-trigger

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/purchase-receiving
          fetch-depth: 0

      - name: Apply supplier bank fix
        run: python .supplier-bank-fix.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Full application build
        run: npm run build

      - name: Commit clean fix to preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .supplier-bank-fix.py .supplier-bank-fix-trigger .github/workflows/fix-supplier-bank-payment-preview.yml
          git add app/suppliers/[id]/_supplier-ledger.tsx app/suppliers/[id]/_purchase-account.tsx app/suppliers/[id]/ledger-actions.ts app/suppliers/[id]/page.tsx lib/services/supplierLedgerService.ts lib/bank-account-presentation.ts prisma/migrations/20260910150000_supplier_ledger_bank_payments/migration.sql
          git commit -m "fix(finance): support bank payments in supplier ledger"
          git push origin HEAD:preview/purchase-receiving
